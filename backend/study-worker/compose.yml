services:
  embeddings:
    image: edus-study:local
    build: .
    command: [python, -m, study_worker, serve]
    environment:
      STUDY_INTERNAL_TOKEN: ${STUDY_INTERNAL_TOKEN:?Set STUDY_INTERNAL_TOKEN in backend/.env}
      STUDY_EMBEDDING_HOST: 0.0.0.0
      STUDY_EMBEDDING_REVISION: ${STUDY_EMBEDDING_REVISION:-614241f622f53c4eeff9890bdc4f31cfecc418b3}
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    ports: [127.0.0.1:8091:8091]
    volumes: [study-models:/home/study/.cache/huggingface]
    tmpfs: ['/tmp:size=268435456,mode=1777']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 128
    restart: unless-stopped
  ingestion:
    image: edus-study:local
    build: .
    command: [python, -m, study_worker, work]
    env_file: ../.env
    environment:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    volumes: [study-models:/home/study/.cache/huggingface]
    tmpfs: ['/tmp:size=268435456,mode=1777']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 128
    restart: unless-stopped
volumes:
  study-models:
