name: EduSphere Backend CI/CD

on:
  push:
    branches: [ main, Priyanshu ]
    paths:
      - 'backend/**'
      - '.github/scripts/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/scripts/**'
      - '.github/workflows/deploy.yml'

jobs:
  # ====================================================
  # CI: Verification & Quality Gate
  # ====================================================
  verify:
    name: Run Architecture & Role Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Verification Checks
        working-directory: ./backend
        run: |
          node ../.github/scripts/check-roles.js
          node ../.github/scripts/check-slug-format.js
          node ../.github/scripts/check-architecture-consistency.js

  # ====================================================
  # CD: Deploy to Host & Restart Systemd Service
  # ====================================================
  deploy:
    name: Deploy to Production
    needs: verify
    timeout-minutes: 15
    concurrency:
      group: edus-backend-production
      cancel-in-progress: false
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Priyanshu') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Update Service
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: priyanshu
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -T -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" bash -se -- "$DEPLOY_SHA" << 'EOF'
            set -euo pipefail
            if [ "$(id -un)" != "priyanshu" ]; then
              echo "Deployment must run as priyanshu" >&2
              exit 1
            fi

            cd /home/priyanshu/EDUS
            echo "Fetching verified commit $1..."
            git fetch origin "$1"
            git reset --hard "$1"

            cd backend
            # The installed service runs npm run dev and needs nodemon.
            npm ci --include=dev

            echo "Restarting edus-backend.service..."
            sudo -n /usr/bin/systemctl restart edus-backend.service

            echo "Waiting for the API to become healthy..."
            for attempt in $(seq 1 30); do
              if /usr/bin/systemctl is-active --quiet edus-backend.service && curl --fail --silent --show-error --max-time 2 http://127.0.0.1:5001/health; then
                echo
                /usr/bin/systemctl --no-pager status edus-backend.service
                echo "Deployment of $1 completed successfully."
                exit 0
              fi
              sleep 2
            done

            /usr/bin/systemctl --no-pager status edus-backend.service || true
            echo "API did not become healthy after restart" >&2
            exit 1
          EOF
