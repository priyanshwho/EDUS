name: EduSphere Backend CI/CD

on:
  push:
    branches: [ main, Priyanshu ]
    paths:
      - 'backend/**'
      - '.github/scripts/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/scripts/**'

jobs:
  # ====================================================
  # CI: Verification & Quality Gate
  # ====================================================
  verify:
    name: Run Architecture & Role Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Verification Checks
        working-directory: ./backend
        run: |
          node ../.github/scripts/check-roles.js
          node ../.github/scripts/check-slug-format.js
          node ../.github/scripts/check-architecture-consistency.js

  # ====================================================
  # CD: Deploy to Host & Restart Systemd Service
  # ====================================================
  deploy:
    name: Deploy to Production
    needs: verify
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Priyanshu') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Update Service
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SUDO_PASS: ${{ secrets.SERVER_SUDO_PASS || secrets.SERVER_PASSWORD || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" << EOF
            set -e
            echo "📦 Fetching latest changes..."
            cd /home/priyanshu/EDUS
            git fetch origin $REF_NAME
            git reset --hard origin/$REF_NAME

            echo "📦 Installing backend dependencies..."
            cd backend
            npm install

            echo "🔄 Restarting edus-backend.service..."
            if [ -n "$SUDO_PASS" ]; then
              echo "$SUDO_PASS" | sudo -S systemctl restart edus-backend
              echo "🔍 Verifying service status..."
              echo "$SUDO_PASS" | sudo -S systemctl status edus-backend --no-pager
            else
              sudo systemctl restart edus-backend
              echo "🔍 Verifying service status..."
              sudo systemctl status edus-backend --no-pager
            fi

            echo "✅ Deployment completed successfully!"
          EOF
