name: Private study checks

on:
  push:
    branches: [main, Priyanshu, codex/edus-private-rag]
    paths: ['backend/**', 'Frontend/**', '.github/scripts/**', '.github/workflows/private-study.yml']
  pull_request:
    paths: ['backend/**', 'Frontend/**', '.github/scripts/**', '.github/workflows/private-study.yml']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run check:roles
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
        working-directory: Frontend
      - run: node --test test/*.test.mjs
        working-directory: Frontend
      - run: npx tsc --noEmit
        working-directory: Frontend
      - run: npm run build
        working-directory: Frontend
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      # Unit tests use fake vectors and never contact Groq, S3, or a database.
      - run: pip install 'pypdf>=5.9,<6' 'pypdfium2>=4.30,<5' 'Pillow>=11,<12'
      - run: python -m unittest discover -s tests -v
        working-directory: backend/study-worker
